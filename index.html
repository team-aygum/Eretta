<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Eretta</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #000;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input {
  font: inherit;
}

.hidden {
  display: none !important;
}

/* ===== ЭКРАН РЕГИСТРАЦИИ ===== */

.auth {
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 25px;
  background: #000;
}

.auth-box {
  width: 100%;
  max-width: 420px;
}

.logo {
  text-align: center;

  font-size: 42px;
  font-weight: 900;

  margin-bottom: 10px;
}

.subtitle {
  text-align: center;

  color: #999;

  margin-bottom: 40px;
}

.input {
  width: 100%;

  padding: 16px;

  margin-bottom: 12px;

  border: 1px solid #333;
  border-radius: 14px;

  outline: none;

  background: #171717;
  color: white;
}

.input:focus {
  border-color: white;
}

.main-button {
  width: 100%;

  padding: 16px;

  margin-top: 8px;

  border: none;
  border-radius: 14px;

  background: white;
  color: black;

  font-weight: 700;

  cursor: pointer;
}

.error {
  color: #ff5b5b;

  font-size: 14px;

  margin-top: 12px;

  text-align: center;
}

/* ===== ПРИЛОЖЕНИЕ ===== */

.app {
  height: 100vh;
  position: relative;
}

.header {
  position: fixed;

  top: 0;
  left: 0;
  right: 0;

  height: 70px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 20px;

  z-index: 20;

  background: linear-gradient(
    rgba(0,0,0,.7),
    transparent
  );
}

.header-logo {
  font-size: 25px;
  font-weight: 900;
}

.header-user {
  font-size: 14px;
  color: #aaa;
}

/* ===== ЛЕНТА ===== */

.feed {
  height: 100vh;

  overflow-y: auto;

  scroll-snap-type: y mandatory;
}

.post {
  height: 100vh;

  position: relative;

  scroll-snap-align: start;

  background:
    radial-gradient(
      circle at 30% 20%,
      #444,
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #111,
      #292929,
      #050505
    );
}

.post-content {
  position: absolute;

  left: 20px;
  right: 90px;
  bottom: 100px;
}

.author {
  font-weight: 700;
  margin-bottom: 10px;
}

.description {
  color: #ddd;
  line-height: 1.4;
}

.actions {
  position: absolute;

  right: 15px;
  bottom: 110px;

  display: flex;
  flex-direction: column;

  gap: 20px;
}

.action {
  background: none;
  border: none;

  color: white;

  font-size: 30px;

  cursor: pointer;
}

.action small {
  display: block;

  font-size: 12px;
}

/* ===== НИЖНЕЕ МЕНЮ ===== */

.bottom {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 65px;

  display: flex;
  align-items: center;
  justify-content: space-around;

  z-index: 30;

  background: rgba(0,0,0,.8);
  backdrop-filter: blur(15px);
}

.bottom button {
  border: none;
  background: none;

  color: white;

  font-size: 21px;
}

.bottom span {
  display: block;

  font-size: 9px;
  margin-top: 3px;
}

.create {
  width: 48px;
  height: 38px;

  border-radius: 12px !important;

  background: white !important;
  color: black !important;

  font-size: 27px !important;
}

/* ===== ПРОФИЛЬ ===== */

.profile {
  min-height: 100vh;

  padding: 90px 20px 100px;

  background: #080808;
}

.profile-avatar {
  width: 80px;
  height: 80px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: white;
  color: black;

  font-size: 30px;
  font-weight: 900;

  margin-bottom: 15px;
}

.profile-name {
  font-size: 24px;
  font-weight: 800;
}

.profile-username {
  color: #888;
  margin-top: 5px;
}

.logout {
  margin-top: 30px;

  padding: 13px 20px;

  border: 1px solid #333;
  border-radius: 12px;

  background: transparent;
  color: white;
}
</style>
</head>

<body>

<!-- ================= РЕГИСТРАЦИЯ ================= -->

<section id="auth" class="auth">

  <div class="auth-box">

    <div class="logo">
      Eretta
    </div>

    <div class="subtitle">
      Социальная сеть, которая не боится офлайна.
    </div>

    <input
      id="name"
      class="input"
      type="text"
      placeholder="Твоё имя"
    >

    <input
      id="username"
      class="input"
      type="text"
      placeholder="@username"
    >

    <button
      class="main-button"
      onclick="register()"
    >
      Создать аккаунт
    </button>

    <div id="error" class="error"></div>

  </div>

</section>


<!-- ================= ПРИЛОЖЕНИЕ ================= -->

<section id="app" class="app hidden">

  <header class="header">

    <div class="header-logo">
      Eretta
    </div>

    <div id="headerUser" class="header-user"></div>

  </header>


  <!-- ЛЕНТА -->

  <main id="feed" class="feed">

    <article class="post">

      <div class="post-content">

        <div class="author">
          @eretta
        </div>

        <div class="description">
          Добро пожаловать в Eretta 🚀
          <br><br>
          Это первый пост нашей социальной сети.
        </div>

      </div>


      <div class="actions">

        <button
          class="action"
          onclick="like(this)"
        >
          ♡
          <small>0</small>
        </button>

        <button
          class="action"
          onclick="alert('Комментарии появятся следующим обновлением')"
        >
          💬
          <small>0</small>
        </button>

        <button
          class="action"
          onclick="alert('Система публикации скоро появится')"
        >
          ↗
        </button>

      </div>

    </article>

  </main>


  <!-- НИЖНЕЕ МЕНЮ -->

  <nav class="bottom">

    <button onclick="showFeed()">
      🏠
      <span>Главная</span>
    </button>

    <button onclick="alert('Поиск скоро появится')">
      🔎
      <span>Поиск</span>
    </button>

    <button
      class="create"
      onclick="createPost()"
    >
      ＋
    </button>

    <button onclick="alert('Уведомления скоро появятся')">
      ♡
      <span>Активность</span>
    </button>

    <button onclick="showProfile()">
      👤
      <span>Профиль</span>
    </button>

  </nav>

</section>


<!-- ================= ПРОФИЛЬ ================= -->

<section id="profile" class="profile hidden">

  <div id="profileAvatar"
       class="profile-avatar">
  </div>

  <div id="profileName"
       class="profile-name">
  </div>

  <div id="profileUsername"
       class="profile-username">
  </div>

  <button
    class="logout"
    onclick="logout()"
  >
    Выйти
  </button>

</section>


<script>

/* ==========================================
   ДАННЫЕ ПОЛЬЗОВАТЕЛЯ
========================================== */

function getUser() {

  const saved =
    localStorage.getItem("eretta_user");

  if (!saved) {
    return null;
  }

  return JSON.parse(saved);
}


/* ==========================================
   РЕГИСТРАЦИЯ
========================================== */

function register() {

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  let username =
    document
      .getElementById("username")
      .value
      .trim()
      .replace("@", "")
      .replace(/\s/g, "")
      .toLowerCase();

  const error =
    document.getElementById("error");


  if (!name) {

    error.textContent =
      "Введите своё имя.";

    return;
  }


  if (!username) {

    error.textContent =
      "Придумайте username.";

    return;
  }


  if (username.length < 3) {

    error.textContent =
      "Username должен содержать минимум 3 символа.";

    return;
  }


  const user = {

    name: name,

    username: username,

    createdAt: Date.now()

  };


  localStorage.setItem(
    "eretta_user",
    JSON.stringify(user)
  );


  openApp();
}


/* ==========================================
   ОТКРЫТИЕ ПРИЛОЖЕНИЯ
========================================== */

function openApp() {

  const user = getUser();

  if (!user) {
    return;
  }


  document
    .getElementById("auth")
    .classList
    .add("hidden");


  document
    .getElementById("profile")
    .classList
    .add("hidden");


  document
    .getElementById("app")
    .classList
    .remove("hidden");


  document
    .getElementById("headerUser")
    .textContent =
    "@" + user.username;
}


/* ==========================================
   ПРОФИЛЬ
========================================== */

function showProfile() {

  const user = getUser();

  if (!user) {
    return;
  }


  document
    .getElementById("app")
    .classList
    .add("hidden");


  document
    .getElementById("profile")
    .classList
    .remove("hidden");


  document
    .getElementById("profileName")
    .textContent =
    user.name;


  document
    .getElementById("profileUsername")
    .textContent =
    "@" + user.username;


  document
    .getElementById("profileAvatar")
    .textContent =
    user.name
      .charAt(0)
      .toUpperCase();
}


function showFeed() {

  document
    .getElementById("profile")
    .classList
    .add("hidden");

  document
    .getElementById("app")
    .classList
    .remove("hidden");
}


/* ==========================================
   ВЫХОД
========================================== */

function logout() {

  localStorage.removeItem(
    "eretta_user"
  );

  location.reload();
}


/* ==========================================
   ЛАЙК
========================================== */

function like(button) {

  const counter =
    button.querySelector("small");

  let number =
    Number(counter.textContent);


  if (button.dataset.liked !== "true") {

    number++;

    button.dataset.liked = "true";

    button.firstChild.textContent =
      "♥ ";

  } else {

    number--;

    button.dataset.liked = "false";

    button.firstChild.textContent =
      "♡ ";
  }


  counter.textContent =
    number;
}


/* ==========================================
   СОЗДАНИЕ ПОСТА
========================================== */

function createPost() {

  alert(
    "Следующим шагом здесь появится выбор видео с телефона."
  );
}


/* ==========================================
   ЗАПУСК
========================================== */

if (getUser()) {

  openApp();

} else {

  document
    .getElementById("auth")
    .classList
    .remove("hidden");
}

</script>

</body>
</html>

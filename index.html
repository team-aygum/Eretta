<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>

<meta name="theme-color" content="#050505">

<title>Eretta</title>

<style>
/* =========================================================
   ERETTA — FOUNDATION
   PART 1
   ========================================================= */

:root {
  --bg: #050505;
  --surface: #101010;
  --surface-2: #171717;
  --surface-3: #202020;

  --text: #ffffff;
  --text-2: #b8b8bd;
  --text-3: #77777d;

  --border: rgba(255,255,255,.09);

  --accent: #ffffff;
  --accent-text: #000000;

  --danger: #ff3b30;
  --success: #30d158;

  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 28px;

  --nav-height: 72px;
  --sidebar-width: 250px;

  --ease: cubic-bezier(.22,.61,.36,1);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;

  background: var(--bg);
  color: var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

body {
  overscroll-behavior: none;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

img,
video {
  display: block;
  max-width: 100%;
}

svg {
  display: block;
}

.hidden {
  display: none !important;
}

/* =========================================================
   LIGHT THEME
   ========================================================= */

html[data-theme="light"] {
  --bg: #f7f7f8;
  --surface: #ffffff;
  --surface-2: #f0f0f2;
  --surface-3: #e7e7e9;

  --text: #080808;
  --text-2: #5f5f64;
  --text-3: #8d8d92;

  --border: rgba(0,0,0,.09);

  --accent: #080808;
  --accent-text: #ffffff;
}

/* =========================================================
   APP
   ========================================================= */

#app {
  width: 100%;
  height: 100dvh;
  min-height: 100svh;

  overflow: hidden;

  background: var(--bg);
}

.app-shell {
  width: 100%;
  height: 100%;

  display: flex;

  overflow: hidden;
}

/* =========================================================
   DESKTOP SIDEBAR
   ========================================================= */

.sidebar {
  position: relative;

  width: var(--sidebar-width);
  min-width: var(--sidebar-width);

  height: 100%;

  display: flex;
  flex-direction: column;

  padding:
    max(24px, env(safe-area-inset-top))
    14px
    max(20px, env(safe-area-inset-bottom));

  border-right: 1px solid var(--border);

  background: var(--surface);

  z-index: 20;
}

.brand {
  height: 62px;

  display: flex;
  align-items: center;

  padding: 0 14px;

  font-size: 26px;
  font-weight: 900;
  letter-spacing: -1.3px;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;

  margin-top: 20px;
}

.nav-button {
  width: 100%;
  min-height: 50px;

  display: flex;
  align-items: center;

  gap: 14px;

  padding: 0 14px;

  border-radius: 14px;

  background: transparent;
  color: var(--text-2);

  text-align: left;

  transition:
    background .18s var(--ease),
    color .18s var(--ease),
    transform .18s var(--ease);
}

.nav-button:hover {
  background: var(--surface-2);
  color: var(--text);
}

.nav-button:active {
  transform: scale(.98);
}

.nav-button.active {
  background: var(--surface-2);
  color: var(--text);
}

.nav-icon {
  width: 22px;
  height: 22px;

  flex: 0 0 22px;
}

.nav-label {
  font-size: 15px;
  font-weight: 650;
}

.sidebar-bottom {
  margin-top: auto;
}

.user-mini {
  width: 100%;

  display: flex;
  align-items: center;

  gap: 11px;

  padding: 10px;

  border-radius: 16px;

  background: transparent;

  color: var(--text);

  text-align: left;
}

.user-mini:hover {
  background: var(--surface-2);
}

.user-mini-avatar {
  width: 38px;
  height: 38px;

  flex: 0 0 38px;

  border-radius: 50%;

  overflow: hidden;

  background: var(--surface-3);

  display: grid;
  place-items: center;

  font-size: 13px;
  font-weight: 800;
}

.user-mini-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.user-mini-info {
  min-width: 0;
}

.user-mini-name {
  font-size: 13px;
  font-weight: 750;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.user-mini-handle {
  margin-top: 2px;

  color: var(--text-3);

  font-size: 12px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* =========================================================
   MAIN
   ========================================================= */

.main {
  position: relative;

  flex: 1;
  min-width: 0;
  min-height: 0;

  height: 100%;

  overflow: hidden;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height:
    calc(
      62px +
      env(safe-area-inset-top)
    );

  padding:
    env(safe-area-inset-top)
    18px
    0;

  display: flex;
  align-items: center;

  z-index: 30;

  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.58),
      transparent
    );
}

.topbar > * {
  pointer-events: auto;
}

.mobile-brand {
  display: none;

  font-size: 22px;
  font-weight: 900;
  letter-spacing: -1px;
}

/* =========================================================
   CONTENT
   ========================================================= */

.content {
  width: 100%;
  height: 100%;

  overflow: hidden;
}

/* =========================================================
   EMPTY FEED
   ========================================================= */

.empty-feed {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 30px;
}

.empty-feed-inner {
  width: min(420px, 100%);

  text-align: center;
}

.empty-icon {
  width: 72px;
  height: 72px;

  margin: 0 auto 24px;

  display: grid;
  place-items: center;

  border-radius: 22px;

  background: var(--surface-2);
  color: var(--text);
}

.empty-icon svg {
  width: 32px;
  height: 32px;
}

.empty-title {
  font-size: 25px;
  font-weight: 850;

  letter-spacing: -.6px;
}

.empty-description {
  margin-top: 10px;

  color: var(--text-2);

  font-size: 14px;
  line-height: 1.55;
}

.primary-button {
  min-height: 48px;

  margin-top: 22px;

  padding: 0 20px;

  border-radius: 14px;

  background: var(--accent);
  color: var(--accent-text);

  font-weight: 800;

  transition:
    transform .16s var(--ease),
    opacity .16s var(--ease);
}

.primary-button:hover {
  opacity: .9;
}

.primary-button:active {
  transform: scale(.97);
}

/* =========================================================
   MOBILE NAV
   ========================================================= */

.mobile-nav {
  display: none;

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height:
    calc(
      var(--nav-height) +
      env(safe-area-inset-bottom)
    );

  padding:
    0
    8px
    env(safe-area-inset-bottom);

  background:
    rgba(10,10,10,.92);

  border-top: 1px solid var(--border);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  z-index: 50;
}

.mobile-nav-inner {
  width: 100%;
  height: var(--nav-height);

  display: grid;
  grid-template-columns:
    repeat(5, 1fr);
}

.mobile-nav-button {
  position: relative;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 4px;

  background: transparent;

  color: var(--text-3);
}

.mobile-nav-button.active {
  color: var(--text);
}

.mobile-nav-button svg {
  width: 22px;
  height: 22px;
}

.mobile-nav-button span {
  font-size: 10px;
  font-weight: 650;
}

/* =========================================================
   AUTH
   ========================================================= */

.auth-screen {
  position: fixed;

  inset: 0;

  z-index: 9999;

  min-height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding:
    max(24px, env(safe-area-inset-top))
    20px
    max(24px, env(safe-area-inset-bottom));

  background: #050505;

  overflow-y: auto;
}

.auth-glow {
  position: fixed;

  inset: 0;

  pointer-events: none;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(255,255,255,.08),
      transparent 35%
    );
}

.auth-card {
  position: relative;

  width: min(420px, 100%);

  padding: 34px;

  border:
    1px solid rgba(255,255,255,.1);

  border-radius: 28px;

  background:
    rgba(18,18,18,.94);

  box-shadow:
    0 30px 100px rgba(0,0,0,.55);

  animation:
    authAppear .3s var(--ease) both;
}

@keyframes authAppear {
  from {
    opacity: 0;
    transform:
      translateY(14px)
      scale(.98);
  }

  to {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }
}

.auth-logo {
  margin-bottom: 34px;

  font-size: 30px;
  font-weight: 950;

  letter-spacing: -1.5px;
}

.auth-title {
  font-size: 30px;
  font-weight: 850;

  letter-spacing: -.8px;
}

.auth-subtitle {
  margin-top: 8px;

  color: #96969c;

  font-size: 14px;
}

.auth-form {
  margin-top: 26px;
}

.field {
  margin-top: 15px;
}

.field-label {
  display: block;

  margin-bottom: 7px;

  color: #c9c9ce;

  font-size: 13px;
  font-weight: 700;
}

.input {
  width: 100%;

  height: 52px;

  padding: 0 15px;

  border:
    1px solid rgba(255,255,255,.1);

  border-radius: 14px;

  outline: none;

  background:
    rgba(255,255,255,.055);

  color: #fff;

  transition:
    border-color .18s ease,
    background .18s ease,
    box-shadow .18s ease;
}

.input::placeholder {
  color: #68686e;
}

.input:focus {
  border-color:
    rgba(255,255,255,.4);

  background:
    rgba(255,255,255,.075);

  box-shadow:
    0 0 0 4px rgba(255,255,255,.04);
}

.auth-submit {
  width: 100%;

  height: 52px;

  margin-top: 22px;

  border-radius: 14px;

  background: #fff;
  color: #000;

  font-weight: 850;

  transition:
    transform .16s var(--ease),
    opacity .16s ease;
}

.auth-submit:hover {
  opacity: .9;
}

.auth-submit:active {
  transform: scale(.98);
}

.auth-error {
  margin-top: 13px;

  padding: 11px 13px;

  border-radius: 12px;

  background: rgba(255,59,48,.1);

  color: #ff6259;

  font-size: 13px;

  line-height: 1.4;
}

.auth-switch {
  margin-top: 22px;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 5px;

  color: #85858b;

  font-size: 13px;

  text-align: center;
}

.auth-switch button {
  background: transparent;

  color: #fff;

  font-weight: 800;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast-container {
  position: fixed;

  left: 50%;
  bottom: 30px;

  transform: translateX(-50%);

  z-index: 10000;

  pointer-events: none;

  display: flex;
  flex-direction: column;

  gap: 8px;

  width: min(380px, calc(100% - 30px));
}

.toast {
  padding: 13px 16px;

  border:
    1px solid var(--border);

  border-radius: 14px;

  background:
    rgba(25,25,25,.95);

  color: #fff;

  box-shadow:
    0 15px 40px rgba(0,0,0,.3);

  font-size: 13px;

  animation:
    toastIn .22s var(--ease) both;
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 767px) {

  .sidebar {
    display: none;
  }

  .mobile-nav {
    display: block;
  }

  .mobile-brand {
    display: block;
  }

  .topbar {
    justify-content: center;
  }

  .main {
    width: 100%;
  }

  .auth-card {
    padding: 28px 21px;
    border-radius: 23px;
  }

  .auth-screen {
    align-items: flex-start;

    padding-top:
      max(
        70px,
        calc(
          env(safe-area-inset-top) + 40px
        )
      );
  }

  .empty-feed {
    padding-bottom:
      calc(
        var(--nav-height) +
        env(safe-area-inset-bottom) +
        30px
      );
  }
}

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="toastContainer" class="toast-container"></div>

<script>
/* =========================================================
   ERETTA APPLICATION ENGINE
   ========================================================= */

"use strict";

/* =========================================================
   STORAGE
   ========================================================= */

const STORAGE = {
  USERS: "eretta.users.v1",
  VIDEOS: "eretta.videos.v1",
  SESSION: "eretta.session.v1",
  SETTINGS: "eretta.settings.v1",
  COMMENTS: "eretta.comments.v1"
};

/* =========================================================
   HELPERS
   ========================================================= */

function uid(prefix = "id") {
  return (
    prefix +
    "_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2, 10)
  );
}

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);

    if (!raw) {
      return fallback;
    }

    return JSON.parse(raw);
  } catch {
    return fallback;
  }
}

function writeJSON(key, value) {
  localStorage.setItem(
    key,
    JSON.stringify(value)
  );
}

function escapeHTML(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getInitials(name = "") {
  const clean = name.trim();

  if (!clean) {
    return "E";
  }

  return clean
    .split(/\s+/)
    .slice(0, 2)
    .map(part => part[0])
    .join("")
    .toUpperCase();
}

function formatCount(value = 0) {
  const number = Number(value) || 0;

  if (number >= 1000000) {
    return (
      (number / 1000000)
        .toFixed(number >= 10000000 ? 0 : 1)
        .replace(".0", "") +
      "M"
    );
  }

  if (number >= 1000) {
    return (
      (number / 1000)
        .toFixed(number >= 10000 ? 0 : 1)
        .replace(".0", "") +
      "K"
    );
  }

  return String(number);
}

/* =========================================================
   STATE
   ========================================================= */

const state = {
  page: "feed",

  authMode: "login",

  userId: readJSON(
    STORAGE.SESSION,
    null
  ),

  theme:
    readJSON(
      STORAGE.SETTINGS,
      { theme: "system" }
    ).theme || "system",

  users: readJSON(
    STORAGE.USERS,
    []
  ),

  videos: readJSON(
    STORAGE.VIDEOS,
    []
  ),

  comments: readJSON(
    STORAGE.COMMENTS,
    []
  )
};

/* =========================================================
   PERSISTENCE
   ========================================================= */

function saveState() {
  writeJSON(
    STORAGE.USERS,
    state.users
  );

  writeJSON(
    STORAGE.VIDEOS,
    state.videos
  );

  writeJSON(
    STORAGE.COMMENTS,
    state.comments
  );

  writeJSON(
    STORAGE.SETTINGS,
    {
      theme: state.theme
    }
  );

  writeJSON(
    STORAGE.SESSION,
    state.userId
  );
}

/* =========================================================
   AUTH
   ========================================================= */

function currentUser() {
  if (!state.userId) {
    return null;
  }

  return (
    state.users.find(
      user => user.id === state.userId
    ) || null
  );
}

function isLoggedIn() {
  return !!currentUser();
}

function normalizeUsername(username) {
  return username
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "");
}

function validateUsername(username) {

  if (!username) {
    return "Введите username.";
  }

  if (username.length < 3) {
    return "Username должен содержать минимум 3 символа.";
  }

  if (username.length > 30) {
    return "Username слишком длинный.";
  }

  if (!/^[a-z0-9._]+$/.test(username)) {
    return "Используй латинские буквы, цифры, точку или _.";
  }

  return null;
}

function register(username, password, confirmation) {

  const cleanUsername =
    normalizeUsername(username);

  const usernameError =
    validateUsername(cleanUsername);

  if (usernameError) {
    throw new Error(usernameError);
  }

  if (!password || password.length < 6) {
    throw new Error(
      "Пароль должен содержать минимум 6 символов."
    );
  }

  if (password !== confirmation) {
    throw new Error(
      "Пароли не совпадают."
    );
  }

  const exists =
    state.users.some(
      user =>
        user.username === cleanUsername
    );

  if (exists) {
    throw new Error(
      "Этот username уже занят."
    );
  }

  const user = {
    id: uid("user"),

    username: cleanUsername,

    displayName: cleanUsername,

    password,

    avatar: null,

    bio: "",

    followers: [],

    following: [],

    likedVideos: [],

    savedVideos: [],

    createdAt:
      new Date().toISOString()
  };

  state.users.push(user);

  state.userId = user.id;

  state.page = "feed";

  saveState();

  toast(
    "Аккаунт создан"
  );
}

function login(username, password) {

  const cleanUsername =
    normalizeUsername(username);

  const user =
    state.users.find(
      item =>
        item.username === cleanUsername &&
        item.password === password
    );

  if (!user) {
    throw new Error(
      "Неверный username или пароль."
    );
  }

  state.userId = user.id;

  state.page = "feed";

  saveState();

  toast(
    "С возвращением, " +
    user.username
  );
}

function logout() {

  state.userId = null;

  state.page = "feed";

  saveState();

  toast(
    "Вы вышли из аккаунта"
  );
}

/* =========================================================
   THEME
   ========================================================= */

function applyTheme() {

  let theme =
    state.theme;

  if (theme === "system") {

    const dark =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

    document.documentElement.dataset.theme =
      dark
        ? "dark"
        : "light";

    return;
  }

  document.documentElement.dataset.theme =
    theme;
}

window
  .matchMedia(
    "(prefers-color-scheme: dark)"
  )
  .addEventListener(
    "change",
    () => {

      if (
        state.theme ===
        "system"
      ) {
        applyTheme();
      }

    }
  );

/* =========================================================
   ICONS
   ========================================================= */

const Icons = {

  home: `
    <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M3 10.5 12 3l9 7.5"/>
      <path d="M5 9.5V21h14V9.5"/>
      <path d="M9 21v-6h6v6"/>
    </svg>
  `,

  search: `
    <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-4-4"/>
    </svg>
  `,

  plus: `
    <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round">
      <path d="M12 5v14"/>
      <path d="M5 12h14"/>
    </svg>
  `,

  bell: `
    <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
      <path d="M10 21h4"/>
    </svg>
  `,

  user: `
    <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
    </svg>
  `,

  settings: `
    <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"

/* =========================================================
   TOAST
   ========================================================= */

function toast(message) {

  const container =
    document.getElementById(
      "toastContainer"
    );

  if (!container) {
    return;
  }

  const element =
    document.createElement("div");

  element.className =
    "toast";

  element.textContent =
    message;

  container.appendChild(
    element
  );

  setTimeout(() => {

    element.style.opacity = "0";

    element.style.transform =
      "translateY(8px)";

    setTimeout(
      () => element.remove(),
      180
    );

  }, 2400);
}

function bindAuthEvents() {

  const form =
    document.getElementById(
      "authForm"
    );

  const switchButton =
    document.getElementById(
      "authSwitch"
    );

  if (!form) {
    return;
  }

  form.addEventListener(
    "submit",
    event => {

      event.preventDefault();

      const username =
        document.getElementById(
          "authUsername"
        )?.value || "";

      const password =
        document.getElementById(
          "authPassword"
        )?.value || "";

      const confirmation =
        document.getElementById(
          "authPasswordConfirm"
        )?.value || "";

      const error =
        document.getElementById(
          "authError"
        );

      try {

        if (
          state.authMode ===
          "register"
        ) {

          register(
            username,
            password,
            confirmation
          );

        } else {

          login(
            username,
            password
          );

        }

        render();

      } catch (err) {

        if (error) {

          error.textContent =
            err.message;

          error.classList.remove(
            "hidden"
          );

        }

      }

    }
  );

  if (switchButton) {

    switchButton.addEventListener(
      "click",
      () => {

        state.authMode =
          state.authMode ===
          "login"
            ? "register"
            : "login";

        render();

      }
    );

  }
}

/* =========================================================
   UPLOAD — FOUNDATION
   ========================================================= */

function bindUpload() {

  const button =
    document.getElementById(
      "selectVideoButton"
    );

  const picker =
    document.getElementById(
      "videoPicker"
    );

  if (!button || !picker) {
    return;
  }

  button.addEventListener(
    "click",
    () => {
      picker.click();
    }
  );

  picker.addEventListener(
    "change",
    event => {

      const file =
        event.target.files?.[0];

      if (!file) {
        return;
      }

      if (
        !file.type.startsWith(
          "video/"
        )
      ) {

        toast(
          "Выбери видеофайл."
        );

        return;
      }

      /*
       * Полноценный upload flow
       * будет подключён следующим
       * блоком.
       */

      toast(
        "Видео выбрано: " +
        file.name
      );

    }
  );
}

/* =========================================================
   RENDER
   ========================================================= */

function render() {

  applyTheme();

  const app =
    document.getElementById(
      "app"
    );

  if (!app) {
    return;
  }

  if (!isLoggedIn()) {

    app.innerHTML =
      renderAuth();

    bindAuthEvents();

    return;
  }

  app.innerHTML =
    renderShell();

  bindNavigation();

  bindSettings();

  bindUpload();
}

/* =========================================================
   START
   ========================================================= */

applyTheme();

render();

</script>

</body>
</html>

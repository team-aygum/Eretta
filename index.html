<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eretta</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      width: 100%;
      position: relative;
    }

    /* Верхняя панель */

    .top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .search {
      font-size: 25px;
      background: none;
      border: none;
      color: white;
    }

    /* Видео */

    .feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    .video {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        160deg,
        #171717,
        #333,
        #111
      );
    }

    .video-number {
      font-size: 70px;
      opacity: 0.15;
    }

    /* Информация */

    .info {
      position: absolute;
      bottom: 90px;
      left: 20px;
      right: 90px;
    }

    .username {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .description {
      font-size: 15px;
      line-height: 1.4;
    }

    /* Кнопки */

    .actions {
      position: absolute;
      right: 15px;
      bottom: 100px;

      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .action {
      border: none;
      background: none;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    .count {
      display: block;
      font-size: 12px;
      margin-top: 3px;
    }

    /* Нижняя панель */

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      height: 65px;

      display: flex;
      justify-content: space-around;
      align-items: center;

      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(10px);

      z-index: 20;
    }

    .bottom button {
      border: none;
      background: none;
      color: white;
      font-size: 22px;
    }

    .bottom span {
      display: block;
      font-size: 10px;
      margin-top: 3px;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="top">
    <div class="logo">Eretta</div>
    <button class="search">⌕</button>
  </header>

  <main class="feed">

    <section class="video">
      <div class="video-number">01</div>

      <div class="info">
        <div class="username">@eretta</div>
        <div class="description">
          Добро пожаловать в Eretta 🚀
        </div>
      </div>

      <div class="actions">
        <button class="action" onclick="like(this)">
          ♡
          <span class="count">0</span>
        </button>

        <button class="action">
          💬
          <span class="count">0</span>
        </button>

        <button class="action">
          ↗
        </button>
      </div>
    </section>


    <section class="video">
      <div class="video-number">02</div>

      <div class="info">
        <div class="username">@user2</div>
        <div class="description">
          Второе видео Eretta
        </div>
      </div>

      <div class="actions">
        <button class="action" onclick="like(this)">
          ♡
          <span class="count">0</span>
        </button>

        <button class="action">
          💬
          <span class="count">0</span>
        </button>

        <button class="action">
          ↗
        </button>
      </div>
    </section>

  </main>


  <nav class="bottom">

    <button>
      🏠
      <span>Главная</span>
    </button>

    <button>
      🔎
      <span>Поиск</span>
    </button>

    <button>
      ＋
      <span>Создать</span>
    </button>

    <button>
      ♡
      <span>Активность</span>
    </button>

    <button>
      👤
      <span>Профиль</span>
    </button>

  </nav>

</div>


<script>

function like(button) {

  const count = button.querySelector(".count");

  let number = Number(count.textContent);

  if (button.dataset.liked === "true") {

    number--;

    button.innerHTML = `
      ♡
      <span class="count">${number}</span>
    `;

    button.dataset.liked = "false";

  } else {

    number++;

    button.innerHTML = `
      ♥
      <span class="count">${number}</span>
    `;

    button.dataset.liked = "true";
  }

}

</script>

</body>
</html>
